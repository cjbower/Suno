# Demo Registry Schema
# Canonical demo registry and schema reference.

schema_reference:
  unknown_value: UNKNOWN
  submission_types:
    - internal_founder_demo
    - roster_artist_demo
    - band_demo
    - producer_project_demo
    - collaboration_demo
    - external_submission
    - acquired_concept
    - inbound_pitch
    - organic_discovery
  active_submission_types:
    - internal_founder_demo
  lifecycle_states:
    - submitted
    - intake_incomplete
    - intake_validated
    - triage
    - under_review
    - focus_group
    - development_candidate
    - in_development
    - on_hold
    - approved_seed
    - promoted_to_work
    - collaboration_candidate
    - handoff_candidate
    - licensing_candidate
    - declined
    - withdrawn
    - archived
  fields:
    demo_id: stable demo identifier
    title: working title or UNKNOWN
    creation_date: source creation date or UNKNOWN
    creator: credited creator or UNKNOWN
    submission_type: one of submission_types
    submission_source: origin or UNKNOWN
    submitted_by: authorized submitter identifier or UNKNOWN
    submitted_at: date or UNKNOWN
    ownership_assertion: submitted assertion, not rights approval
    contract_required: true, false, or UNKNOWN
    external_contributors: contributor references or UNKNOWN
    rights_review_status: status or UNKNOWN
    source_material_id: source registry identifier or UNKNOWN
    source_material: classification or UNKNOWN
    source_material_description: description or UNKNOWN
    audio_location: approved asset location or UNKNOWN
    audio_sha256: checksum or UNKNOWN
    audio_downloaded: whether a local original was received
    suno_song_id: platform identifier or UNKNOWN
    suno_url: platform URL or UNKNOWN
    generator: generator name or UNKNOWN
    model_version: model/version or UNKNOWN
    original_prompt_status: status or UNKNOWN
    original_prompt: preserved prompt or UNKNOWN
    exclude_prompt: preserved exclusion prompt or UNKNOWN
    lyrics_status: status or UNKNOWN
    lyrics_location: approved asset location or UNKNOWN
    lyrics_available: whether lyrics were present in source evidence
    prompt_available: whether original prompt evidence was present
    language: language or UNKNOWN
    approximate_genre: genre or UNKNOWN
    approximate_bpm: BPM or UNKNOWN
    review_status: lifecycle state or UNKNOWN
    development_status: status or UNKNOWN
    current_disposition: A&R disposition or UNKNOWN
    owner: accountable next-step owner or UNKNOWN
    next_action: bounded action or UNKNOWN
    risks: known risks or UNKNOWN
    required_evidence: evidence required to resolve the review or UNKNOWN
    review_trigger: event that reopens review or UNKNOWN
    classification: primary and secondary demo-value classifications; primary stays UNKNOWN until a documented founder review supports it
    classification_rationale: founder-review evidence supporting classification or UNKNOWN
    seed_designation: primary and secondary strategic seed designations; primary stays UNKNOWN until a documented founder review supports it
    seed_rationale: founder-review evidence supporting seed designation or UNKNOWN
    provenance_record: path to the authoritative provenance artifact
    evaluation_record: path to the authoritative review artifact
    development_plan: path to the bounded disposition/next-action plan
    assigned_entity_type: entity type or UNKNOWN
    assigned_entity_id: entity identifier or UNKNOWN
    voice_candidate: candidate reference or UNKNOWN
    production_reference: reference or UNKNOWN
    song_candidate: candidate reference or UNKNOWN
    collaboration_candidate: candidate reference or UNKNOWN
    handoff_candidate: candidate reference or UNKNOWN
    derived_from: parent demo/version identifier or UNKNOWN
    promoted_work_ids: work identifiers or UNKNOWN
    known_defects: documented defects or UNKNOWN
    elements_to_preserve: preserved elements or UNKNOWN
    notes: context or UNKNOWN

