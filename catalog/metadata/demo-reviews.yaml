# Demo Review Schema
# Canonical demo review registry and schema reference.

schema_reference:
  allowed_grades:
    - A
    - B
    - C
    - D
    - F
    - N/R
  numeric_grades: not approved for canonical review records
  fields:
    review_id: stable review identifier
    demo_id: reviewed demo identifier
    review_type: review instrument/type or UNKNOWN
    reviewer_id: authorized reviewer identifier or UNKNOWN
    reviewer_role: reviewer role or UNKNOWN
    review_date: date or UNKNOWN
    evaluation_instrument_version: version or UNKNOWN
    emotional_impact_grade: allowed grade
    song_concept_grade: allowed grade
    hook_grade: allowed grade
    source_fidelity_grade: allowed grade
    voice_performance_grade: allowed grade
    production_identity_grade: allowed grade
    arrangement_grade: allowed grade
    technical_quality_grade: allowed grade
    roster_fit_grade: allowed grade
    development_potential_grade: allowed grade
    overall_creative_grade: editorial grade, not arithmetic
    strongest_element: evidence or UNKNOWN
    weakest_element: evidence or UNKNOWN
    elements_to_preserve: evidence or UNKNOWN
    elements_to_change: evidence or UNKNOWN
    recommended_disposition: disposition or UNKNOWN
    reviewer_confidence: confidence or UNKNOWN
    limitations: limitations or UNKNOWN
    notes: context or UNKNOWN
    category_evidence: written evidence for every grade
    semantic_profile: narrative comments for each polarity pair; do not score
    audio_reviewed: whether the reviewer auditioned the source audio
    founder_review_status: pending, complete, or UNKNOWN

