# Audience Response Schema
# Schema example only. No responses or participant records are registered here.

schema_reference:
  unknown_value: UNKNOWN
  allowed_grades:
    - A
    - B
    - C
    - D
    - F
    - N/R
  fields:
    response_id: response identifier
    session_id: session identifier
    participant_id: anonymous identifier; not a participant record
    cohort: cohort value or UNKNOWN
    submitted_at: timestamp or UNKNOWN
    grade_fields: descriptive letter grades
    semantic_profile: displayed bipolar dimensions
    behavioral_intent: stated intentions, not observed behavior
    open_response: reviewed free text or UNKNOWN
    limitations: response limitations or UNKNOWN

